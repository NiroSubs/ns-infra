AWSTemplateFormatVersion: '2010-09-09'
Description: 'Custom domain configuration for existing NiroSubs CloudFront distribution'

Parameters:
  DomainName:
    Type: String
    Description: Your domain name (e.g., nirosubs.com)
  
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for your domain
    
  CloudFrontDomain:
    Type: String
    Default: dz2lwnpg8aefz.cloudfront.net
    Description: Existing CloudFront distribution domain
    
  ApiGatewayDomain:
    Type: String
    Default: c39q8sqdp8.execute-api.us-east-1.amazonaws.com
    Description: API Gateway domain

Resources:
  # SSL Certificate for the domain
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Ref DomainName
        - !Sub '*.${DomainName}'
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub '*.${DomainName}'
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS

  # Root domain → CloudFront
  RootDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !Ref CloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront Hosted Zone ID
        EvaluateTargetHealth: false

  # www subdomain → CloudFront
  WWWRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref CloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # app subdomain → CloudFront
  AppRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'app.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref CloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # dashboard subdomain → CloudFront
  DashboardRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'dashboard.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref CloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # api subdomain → API Gateway
  ApiRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api.${DomainName}'
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ApiGatewayDomain

  # dev subdomain → CloudFront (for development)
  DevRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'dev.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref CloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # staging subdomain → CloudFront (for staging)
  StagingRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'staging.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref CloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  MainWebsiteURL:
    Description: Main website URL
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-MainURL'
  
  WWWWebsiteURL:
    Description: WWW website URL
    Value: !Sub 'https://www.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-WWWURL'
  
  AppURL:
    Description: Application URL
    Value: !Sub 'https://app.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-AppURL'
  
  DashboardURL:
    Description: Dashboard URL
    Value: !Sub 'https://dashboard.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-DashboardURL'
  
  ApiURL:
    Description: API endpoint URL
    Value: !Sub 'https://api.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiURL'
  
  DevURL:
    Description: Development environment URL
    Value: !Sub 'https://dev.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-DevURL'
  
  StagingURL:
    Description: Staging environment URL
    Value: !Sub 'https://staging.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-StagingURL'
  
  CertificateArn:
    Description: SSL Certificate ARN
    Value: !Ref Certificate
    Export:
      Name: !Sub '${AWS::StackName}-CertificateArn'
  
  NextSteps:
    Description: Next steps to complete setup
    Value: |
      1. Wait for certificate validation (check ACM console)
      2. Update CloudFront distribution to add your domain as CNAME
      3. Attach the SSL certificate to CloudFront
      4. DNS propagation takes 5-30 minutes